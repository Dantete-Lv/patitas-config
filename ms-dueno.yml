server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dueno_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

info:
  app:
    name: ms-dueno
    description: Microservicio de gestión de dueños
    version: 1.0.0
