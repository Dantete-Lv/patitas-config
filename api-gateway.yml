
server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: ms-dueno
          uri: lb://ms-dueno
          predicates:
            - Path=/api/duenos/**

        - id: ms-mascota
          uri: lb://ms-mascota
          predicates:
            - Path=/api/mascotas/**

        - id: ms-veterinario
          uri: lb://ms-veterinario
          predicates:
            - Path=/api/veterinarios/**

        - id: ms-turno
          uri: lb://ms-turno
          predicates:
            - Path=/api/turnos/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
