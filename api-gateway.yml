server:
  port: 8080

spring:
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: false
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: ms-dueno
              uri: lb://ms-dueno
              predicates:
                - Path=/api/duenos,/api/duenos/**
            - id: ms-mascota
              uri: lb://ms-mascota
              predicates:
                - Path=/api/mascotas,/api/mascotas/**
            - id: ms-veterinario
              uri: lb://ms-veterinario
              predicates:
                - Path=/api/veterinarios,/api/veterinarios/**
            - id: ms-turno
              uri: lb://ms-turno
              predicates:
                - Path=/api/turnos,/api/turnos/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
