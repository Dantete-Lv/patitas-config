server:
  port: 8080


spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: false
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
          - id: ms-dueno
          uri: lb://ms-dueno
          predicates:
          - Path=/api/duenio/**
            - id: ms-mascota
              uri: lb://ms-mascota
              predicates:
                - Path=/api/mascotas/**
            - id: ms-veterinario
              uri: lb://ms-veterinario
              predicates:
                - Path=/api/veterinarios/**
            - id: ms-turno
              uri: lb://ms-turno
              predicates:
                - Path=/api/turnos/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
